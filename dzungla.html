[[6,1.7,-44],[8.5,2.7,-47],[-7,1.8,-48],[-3,1.6,-55],[0,1,-60],[0,1,-66],[0,1,-70],[0,1,-74]].forEach(p=>coin(...p));
crystal(8.5,4.4,-51);
[[0,1.6,-86],[-8,1.6,-84],[6,1.7,-90],[8.5,2.9,-93],[0,1,-96],[0,1,-104],[0,1,-108]].forEach(p=>coin(...p));
crystal(-9,1.3,-96);crystal(8.5,3.7,-97);
for(let i=0;i<4;i++)coin(0,1,-115-i*2.2);
const movers=solids.filter(s=>s.move);
const totalCoins=items.filter(i=>i.type=='coin').length;
const cps=[new THREE.Vector3(0,0,4),new THREE.Vector3(0,0,-40),new THREE.Vector3(0,0,-79),new THREE.Vector3(0,0,-115)];
const cpFlags=cps.map((p,i)=>{if(!i)return null;const g=new THREE.Group();const st=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.4),M(0xeeeeee));st.position.y=1.2;const f=new THREE.Mesh(new THREE.PlaneGeometry(.9,.6),new THREE.MeshStandardMaterial({color:0x999999,side:2}));f.position.set(.45,2.1,0);g.add(st,f);g.position.set(p.x+3,0,p.z);scene.add(g);return f});

const hero=new THREE.Group();scene.add(hero);
const skin=M(0xffc79a),shirt=M(0x2f8cff),pants=M(0x3b3b6b),bag=M(0xc0742a),hatM=M(0xf2b134);
const body=new THREE.Mesh(new THREE.BoxGeometry(.7,.75,.45),shirt);body.position.y=1.05;
const head=new THREE.Mesh(new THREE.SphereGeometry(.33,16,12),skin);head.position.y=1.72;
const hat=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.06,16),hatM);hat.position.y=1.98;const hatTop=new THREE.Mesh(new THREE.CylinderGeometry(.27,.3,.25,16),hatM);hatTop.position.y=2.1;
const eyeM=M(0x222222);const e1=new THREE.Mesh(new THREE.SphereGeometry(.05),eyeM),e2=e1.clone();e1.position.set(-.12,1.76,-.3);e2.position.set(.12,1.76,-.3);

const legL=limb(pants,-.18,.68,.68),legR=limb(pants,.18,.68,.68),armL=limb(skin,-.47,1.38,.62),armR=limb(skin,.47,1.38,.62);
hero.add(body,head,hat,hatTop,e1,e2,pack);hero.traverse(o=>o.castShadow=true);
const shadowBlob=new THREE.Mesh(new THREE.CircleGeometry(.45,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.25}));shadowBlob.rotation.x=-Math.PI/2;scene.add(shadowBlob);
// ---------- UPRAVLJANJE ----------
const keys={};let jumpQ=false,touchRun=false;const joy={x:0,y:0};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){jumpQ=true;e.preventDefault()}if(e.code==='KeyM')toggleMusic()});
addEventListener('keyup',e=>keys[e.code]=false);
const joyEl=$('joy'),knob=$('knob');let joyId=null;
function joyMove(t){const r=joyEl.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);const L=Math.hypot(dx,dy),mx=50;if(L>mx){dx*=mx/L;dy*=mx/L}knob.style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/mx;joy.y=dy/mx}
joyEl.addEventListener('touchstart',e=>{const t=e.changedTouches[0];joyId=t.identifier;joyMove(t);e.preventDefault()},{passive:false});
addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===joyId)joyMove(t)},{passive:false});
addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;joy.x=joy.y=0;knob.style.transform=''}});
$('jumpB').addEventListener('touchstart',e=>{jumpQ=true;e.preventDefault()},{passive:false});
$('runB').addEventListener('touchstart',e=>{touchRun=!touchRun;$('runB').classList.toggle('on',touchRun);e.preventDefault()},{passive:false});
// ---------- STANJE ----------
const P={pos:new THREE.Vector3(),vel:new THREE.Vector3(),onGround:false,ground:null,yaw:0,coyote:0};
let S,playing=false,lastT=0,walkPh=0,camPos=new THREE.Vector3(0,6,12);
function newState(){return{cp:0,got:[],coins:0,gems:0,time:0,lives:3}}
function persist(){localStorage.setItem('sa_save2',JSON.stringify(S))}
function applyState(){items.forEach(it=>it.m.visible=!S.got.includes(it.id));setDoor(true);cpFlags.forEach((f,i)=>f&&f.material.color.set(i<=S.cp?0x22dd55:0x999999));respawn();hud()}
function setDoor(instant){const o=S.gems>=3;door.active=!o;door.target=o?1:0;if(instant)door.t=door.target;doorGems.forEach((g,i)=>{g.material.color.set(i<S.gems?0x4fd8ff:0x666666);g.material.emissive&&g.material.emissive.set(i<S.gems?0x1a6aa0:0)})}
function respawn(){P.pos.copy(cps[S.cp]).add(new THREE.Vector3(0,.1,0));P.vel.set(0,0,0);P.yaw=0}
function score(){return S.coins*10+S.gems*50+(S.gems>=3?100:0)}
function hud(){$('coinsH').textContent=`🪙 ${S.coins}/${totalCoins}`;$('gemH').textContent=`🔮 ${S.gems}/3`;$('scoreH').textContent=`⭐ ${score()}`;$('livesH').textContent='❤️'.repeat(Math.max(0,S.lives))+'🤍'.repeat(3-Math.max(0,S.lives))}
// ---------- FIZIKA ----------
const R=.35,H=1.8,G=23,JV=10.2;
function boxOf(s){const c=s.mesh.position;return{x0:c.x-s.w/2,x1:c.x+s.w/2,y0:c.y-s.h/2,y1:c.y+s.h/2,z0:c.z-s.d/2,z1:c.z+s.d/2}}
function overlap(b,p){return p.x+R>b.x0&&p.x-R<b.x1&&p.z+R>b.z0&&p.z-R<b.z1&&p.y+H>b.y0&&p.y<b.y1}
function physics(dt,t){
 // pokretne platforme
 movers.forEach(s=>{const m=s.move,o=s.mesh.position.clone();s.mesh.position[m.ax]=s.base[m.ax]+Math.sin(t*m.spd+(m.ph||0))*m.amp;s.delta.subVectors(s.mesh.position,o)});
 if(P.onGround&&P.ground&&P.ground.move)P.pos.add(P.ground.delta);
 // ulaz
 let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
 const L=Math.hypot(ix,iz);if(L>1){ix/=L;iz/=L}
 const run=keys.ShiftLeft||keys.ShiftRight||touchRun,sp=run?9.5:5.5;
 const ax=P.onGround?14:6;P.vel.x+=(ix*sp-P.vel.x)*Math.min(1,ax*dt);P.vel.z+=(iz*sp-P.vel.z)*Math.min(1,ax*dt);
 if(L>.1)P.yaw=Math.atan2(-ix,-iz);
 P.coyote=P.onGround?.22:P.coyote-dt;
 if(jumpQ&&P.coyote>0){P.vel.y=JV;P.coyote=0;P.onGround=false;sfx.jump()}jumpQ=false;
 P.vel.y-=G*dt;
 const act=solids.filter(s=>s.active);
 // os X, Z, Y redom
 for(const a of ['x','z']){P.pos[a]+=P.vel[a]*dt;for(const s of act){const b=boxOf(s);if(overlap(b,P.pos)){if(P.pos.y>b.y1-.45){P.pos.y=b.y1;continue}const c=(b[a+'0']+b[a+'1'])/2;P.pos[a]=P.pos[a]<c?b[a+'0']-R-.001:b[a+'1']+R+.001;P.vel[a]=0}}}
 P.pos.y+=P.vel.y*dt;P.onGround=false;P.ground=null;
 for(const s of act){const b=boxOf(s);if(overlap(b,P.pos)){if(P.vel.y<=0&&P.pos.y-P.vel.y*dt>=b.y1-.5){P.pos.y=b.y1;P.vel.y=0;P.onGround=true;P.ground=s}else if(P.vel.y>0){P.pos.y=b.y0-H;P.vel.y=0}}}
 if(P.pos.y<-4){sfx.fall();if(!window.V19||V19.hit()){S.lives--;persist()}if(S.lives<=0){respawn();playing=false;stopMusic();if(window.V19)V19.gameOver();else showUI('over')}else{say(T[lang].fall);respawn()}hud()}
}
// ---------- PETLJA ----------
let warnT=0;
function update(dt,t){
 S.time+=dt;physics(dt,t);
 // predmeti
 items.forEach(it=>{if(!it.m.visible)return;it.m.rotation.y+=dt*2.5;if(it.type!=='coin')it.m.position.y=it.y+Math.sin(t*2+it.id)*.15;else it.m.rotation.z+=dt*3;
  const d=it.m.position.distanceTo(new THREE.Vector3(P.pos.x,P.pos.y+.9,P.pos.z));
  if(d<(it.type==='key'?1.8:1.1)){it.m.visible=false;S.got.push(it.id);if(it.type==='coin'){S.coins++;sfx.coin()}else{S.gems++;sfx.gem();setDoor(false);say(S.gems>=3?T[lang].open:T[lang].gem+' '+S.gems+'/3',S.gems>=3?3500:1800)}hud();persist()}});
 // kontrolne točke
 cps.forEach((c,i)=>{if(i>S.cp&&Math.abs(P.pos.z-c.z)<2.5&&Math.abs(P.pos.x-c.x)<8&&P.pos.y>-1){S.cp=i;cpFlags[i].material.color.set(0x22dd55);sfx.cp();say(T[lang].cp);persist()}});
 // vrata hrama
 door.t+=(door.target-door.t)*Math.min(1,dt*1.5);door.mesh.position.y=3+6.2*door.t;
 if(S.gems<3&&P.pos.z<-122&&P.pos.z>-125&&(warnT-=dt)<0){say(T[lang].locked,2500);warnT=4}
 // majmuni
 monkeys.forEach(m=>{m.cd-=dt;m.arm.rotation.z=Math.sin(t*6)*.6+.6;m.g.position.y=Math.abs(Math.sin(t*3))*.15;m.bub.visible=m.cd<0;const dx=P.pos.x-m.g.position.x,dz=P.pos.z-m.g.position.z;m.g.rotation.y=Math.atan2(dx,dz);if(Math.hypot(dx,dz)<4&&m.cd<0){say('🐒 '+m.msg,4500);sfx.cp();m.cd=10}});
 // cilj - blago
 if(S.gems>=3&&P.pos.z<-130&&Math.abs(P.pos.x)<4&&P.pos.y>-.5)finish();
 chest.rotation.y=Math.sin(t*1.5)*.2;
 water.position.y=-1.4+Math.sin(t*.8)*.08;items.forEach(it=>{if(it.m.userData.glow)it.m.userData.glow.material.opacity=.2+Math.sin(t*4)*.1});
 // animacija lika
 hero.position.copy(P.pos);let dy=P.yaw-hero.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));hero.rotation.y+=dy*Math.min(1,dt*12);
 const hs=Math.hypot(P.vel.x,P.vel.z);walkPh+=hs*dt*1.6;const sw=P.onGround?Math.sin(walkPh)*Math.min(1,hs/5)*.9:-.6;
 legL.rotation.x=sw;legR.rotation.x=P.onGround?-sw:.4;armL.rotation.x=-sw;armR.rotation.x=P.onGround?sw:-2.4;body.position.y=1.05+(P.onGround?Math.abs(Math.sin(walkPh))*.05:0);
 // sjena na tlu
 let gy=-50;for(const s of solids){if(!s.active)continue;const b=boxOf(s);if(P.pos.x>b.x0&&P.pos.x<b.x1&&P.pos.z>b.z0&&P.pos.z<b.z1&&b.y1<=P.pos.y+.05&&b.y1>gy)gy=b.y1}
 shadowBlob.visible=gy>-50;shadowBlob.position.set(P.pos.x,gy+.02,P.pos.z);
 // kamera
 const target=new THREE.Vector3(P.pos.x*.7,P.pos.y+4.3,P.pos.z+7.8);camPos.lerp(target,Math.min(1,dt*4));camera.position.copy(camPos);camera.lookAt(P.pos.x,P.pos.y+1.2,P.pos.z-4);
 sun.position.set(P.pos.x+20,40,P.pos.z+15);sun.target.position.set(P.pos.x,0,P.pos.z);
 hud();
}
function frame(ms){requestAnimationFrame(frame);const t=ms/1000,dt=Math.min(.033,t-lastT||.016);lastT=t;if(playing)update(dt,t);else{camera.position.set(Math.sin(t*.1)*30,18,-50+Math.cos(t*.1)*60);camera.lookAt(0,0,-55)}renderer.render(scene,camera)}
function finish(){playing=false;stopMusic();sfx.win();const fin=score();const best=Math.max(fin,+localStorage.getItem('sa_best2')||0);localStorage.setItem('sa_best2',best);localStorage.removeItem('sa_save2');
 $('wTitle').textContent=T[lang].win;$('wText').innerHTML=T[lang].wtext(S.coins,S.gems,fin,Math.floor(S.time))+`<br>🏆 ${T[lang].best}: ${best}`;showUI('win');localStorage.setItem('sa_unlock',Math.max(3,+localStorage.getItem('sa_unlock')||1));}
function showUI(w){$('start').classList.toggle('hidden',w!=='start');$('win').classList.toggle('hidden',w!=='win');$('over').classList.toggle('hidden',w!=='over');const g=w==='game';$('hud').classList.toggle('hidden',!g);$('help').classList.toggle('hidden',!g||isTouch);$('touch').classList.toggle('hidden',!g||!isTouch);applyLang()}
function play(fresh){ac();S=(!fresh&&getSave())||newState();if(!(S.lives>0))S.lives=3;applyState();playing=true;showUI('game');startMusic();lastT=performance.now()/1000;camPos.set(P.pos.x,P.pos.y+4.3,P.pos.z+7.8)}
$('playB').onclick=()=>play(false);if(/[?&]start=1/.test(location.search)){setTimeout(()=>{try{play(false)}catch(e){}},300)}$('resetB').onclick=()=>{localStorage.removeItem('sa_save2');play(true)};$('againB').onclick=()=>play(true);$('retryB').onclick=()=>{S.lives=3;persist();play(false)};
$('nextB').onclick=()=>location.href='gusari.html?start=1';$('menuW').onclick=()=>location.href='./';
$('menuB').onclick=()=>{playing=false;stopMusic();persist();showUI('start')};
$('musB').onclick=$('musB2').onclick=()=>{ac();toggleMusic()};
$('langB').onclick=()=>{lang=lang==='hr'?'en':'hr';localStorage.setItem('sa_lang',lang);applyLang()};

updMusBtn();applyLang();showUI('start');requestAnimationFrame(frame);
