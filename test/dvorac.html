<!DOCTYPE html>
<html lang="hr"><head><meta charset="utf-8"><script src="profili.js?v=19"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stjepanov otok – Moj dvorac</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
canvas{display:block}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;z-index:5}
.pill{background:rgba(255,255,255,.9);border-radius:14px;padding:8px 12px;font-weight:800;color:#05405e;border:0;font-size:15px}
#bar{position:fixed;left:0;right:0;bottom:150px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:5;padding:0 100px 0 6px}
#bar button{font-size:26px;width:50px;height:50px;border-radius:14px;border:3px solid #fff;background:rgba(255,255,255,.75)}
#bar button.sel{background:#ffd34d;border-color:#c9a227}
#joy{position:fixed;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.3);border:3px solid rgba(255,255,255,.7);z-index:5}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9)}
.act{position:fixed;right:18px;border-radius:50%;border:0;font-weight:900;color:#05405e;z-index:5}
#putB{bottom:20px;width:96px;height:96px;background:#3fcf5a;font-size:16px;box-shadow:0 6px 0 #1d8a32}
#jumpB{bottom:130px;width:70px;height:70px;background:#ffd34d;font-size:15px;box-shadow:0 5px 0 #c9a227}
#undoB{bottom:30px;right:126px;width:60px;height:60px;background:#ff9a8a;font-size:24px}
#msg{position:fixed;top:60px;left:0;right:0;text-align:center;font-weight:900;color:#fff;text-shadow:0 2px 4px #0008;font-size:20px;z-index:5;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
</head><body>
<div id="top"><button class="pill" id="backB">⬅ IZBORNIK</button><span class="pill">🏰 MOJ DVORAC</span><button class="pill" id="clrB">🧹</button></div>
<div id="msg">Hodaj i ukrašavaj svoj dvorac! 🎉</div>
<div id="bar"></div>
<div id="joy"><div id="knob"></div></div>
<button class="act" id="jumpB">SKOK</button>
<button class="act" id="putB">POSTAVI</button>
<button class="act" id="undoB">↩</button>
<script type="module">
import * as THREE from 'three';
const ls=localStorage;
if(!ls.getItem('sa_castle')&&!ls.getItem('sa_best5')){location.replace('./?locked=5');}
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x7fd3ff);scene.fog=new THREE.Fog(0x7fd3ff,40,90);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x88cc66,.9));const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(15,25,10);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-30,bottom:-30,right:30,top:30});scene.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m}
function cyl(rt,rb,h,c,x,y,z,p,s){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s||8),M(c));m.position.set(x,y,z);m.castShadow=true;(p||scene).add(m);return m}
function sph(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),M(c));m.position.set(x,y,z);m.castShadow=true;(p||scene).add(m);return m}
function cone(r,h,c,x,y,z){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,8),M(c));m.position.set(x,y,z);scene.add(m);return m}
const sea=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0x2a9df4));sea.rotation.x=-Math.PI/2;sea.position.y=-.6;scene.add(sea);
const isl=cyl(32,34,1.2,0x7ccf5a,0,-.6,0,scene,32);isl.receiveShadow=true;cyl(34.5,35,.6,0xf5dfa0,0,-.9,0,scene,32);
const W=[];const wall=(w,h,d,x,z)=>{W.push({x,z,w:w/2+.4,d:d/2+.4});return box(w,h,d,0xffe08a,x,h/2,z)};
wall(20,5,1.2,0,-14);wall(1.2,5,14,-10,-7);wall(1.2,5,14,10,-7);
box(5,8,5,0xffd36b,0,4,-16);W.push({x:0,z:-16,w:2.9,d:2.9});cone(3.4,4,0xff7fb6,0,10,-16);
[[-10,-14],[10,-14],[-10,0],[10,0]].forEach(([x,z])=>{cyl(1.8,1.8,8,0xffc94d,x,4,z);cone(2.3,3.5,0xff7fb6,x,9.7,z);W.push({x,z,w:2.2,d:2.2})});
for(let i=-9;i<=9;i+=2)box(1,1,1.3,0xffe08a,i,5.5,-14);
box(3.6,4,.3,0x8a5a2b,0,2,-13.3);
const P=new THREE.Group();scene.add(P);
box(.9,1,.6,0x2f80ed,0,1.1,0,P);box(.8,.7,.3,0x8b5a2b,0,1.15,-.45,P);sph(.42,0xffd1a8,0,1.95,0,P);
cyl(.75,.75,.08,0xd9a441,0,2.25,0,P,12);cyl(.35,.42,.35,0xd9a441,0,2.42,0,P,10);
const lg1=box(.32,.6,.32,0x5b4a2e,-.22,.3,0,P),lg2=box(.32,.6,.32,0x5b4a2e,.22,.3,0,P);
P.position.set(0,0,8);
const KINDS=[['🚩','flag'],['🌸','flower'],['🔥','torch'],['🌴','palm'],['🎁','chest'],['🐰','bunny'],['🌳','tree'],['⭐','star']];
const rc=a=>a[Math.floor(Math.random()*a.length)];
function make(k,col){const g=new THREE.Group();
 if(k==='flag'){cyl(.07,.07,3,0xeeeeee,0,1.5,0,g);box(1.2,.7,.05,col,.6,2.6,0,g)}
 else if(k==='flower'){cyl(.05,.05,.6,0x2e9e3e,0,.3,0,g);for(let i=0;i<5;i++){const a=i*1.256;sph(.17,col,Math.cos(a)*.2,.65,Math.sin(a)*.2,g)}sph(.13,0xfff3b0,0,.67,0,g)}
 else if(k==='torch'){cyl(.1,.12,1.6,0x6b4423,0,.8,0,g);const f=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),new THREE.MeshBasicMaterial({color:0xffb020}));f.position.y=1.75;g.add(f);g.userData.flame=f}
 else if(k==='palm'){cyl(.18,.25,3.4,0x9b6b3a,0,1.7,0,g);for(let i=0;i<6;i++){const p=new THREE.Group();p.position.y=3.4;p.rotation.y=i*1.047;g.add(p);const f=box(2,.08,.5,0x2fb44a,1,0,0,p);f.rotation.z=-.35}}
 else if(k==='chest'){box(1,.6,.7,0x9b5a1a,0,.3,0,g);box(1.04,.3,.74,0xc9a227,0,.72,0,g)}
 else if(k==='bunny'){sph(.35,0xffffff,0,.35,0,g);sph(.25,0xffffff,0,.75,.2,g);box(.08,.4,.1,0xffc0cb,-.1,1.05,.2,g);box(.08,.4,.1,0xffc0cb,.1,1.05,.2,g);g.userData.hop=Math.random()*6}
 else if(k==='tree'){cyl(.2,.3,1.4,0x8b5a2b,0,.7,0,g);sph(1,0x3cb55a,0,2,0,g);sph(.7,0x4ccc66,.5,2.5,.2,g)}
 else if(k==='star'){const s=new THREE.Mesh(new THREE.OctahedronGeometry(.5),new THREE.MeshBasicMaterial({color:0xffd700}));s.position.y=1.4;g.add(s);g.userData.spin=s}
 scene.add(g);return g}
const COLS={flag:[0xff4d6d,0x4dabff,0xffd34d,0x9b59ff],flower:[0xff5fa2,0xffd34d,0xb36bff,0xff7a3d]};
let items=[];try{items=JSON.parse(ls.getItem('sa_dvorac'))||[]}catch(e){items=[]}
const objs=[];
function place(it){const o=make(it.k,it.c);o.position.set(it.x,0,it.z);o.rotation.y=it.r||0;objs.push(o)}
items.forEach(place);
function save(){ls.setItem('sa_dvorac',JSON.stringify(items))}
let sel='flag';const bar=$('bar');
KINDS.forEach(([e,k])=>{const b=document.createElement('button');b.textContent=e;b.onclick=ev=>{ev.stopPropagation();sel=k;[...bar.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');beep(660)};if(k===sel)b.classList.add('sel');bar.appendChild(b)});
let AC=null;function beep(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.3)}catch(e){}}
function say(t){$('msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='',2500)}
setTimeout(()=>say(''),3500);
let face=0;
$('putB').onclick=()=>{if(items.length>=150){say('Dvorac je pun ukrasa! 😄');return}
 const x=P.position.x+Math.sin(face)*1.8,z=P.position.z+Math.cos(face)*1.8;
 if(Math.hypot(x,z)>30){say('Tu je more! 🌊');return}
 const it={k:sel,x:+x.toFixed(2),z:+z.toFixed(2),r:+(Math.random()*6.28).toFixed(2)};if(COLS[sel])it.c=rc(COLS[sel]);
 items.push(it);place(it);save();beep(880);setTimeout(()=>beep(1175),90)};
$('undoB').onclick=()=>{if(!items.length)return;items.pop();scene.remove(objs.pop());save();beep(330)};
$('clrB').onclick=()=>{if(!items.length||!confirm('Maknuti sve ukrase iz dvorca?'))return;items=[];objs.forEach(o=>scene.remove(o));objs.length=0;save()};
$('backB').onclick=()=>location.href='./';
let vy=0,onG=true;$('jumpB').onclick=()=>{if(onG){vy=8;onG=false;beep(500)}};
const joy=$('joy'),knob=$('knob');let jx=0,jz=0,jid=null;
function jm(t){const r=joy.getBoundingClientRect();let dx=t.clientX-r.left-60,dy=t.clientY-r.top-60;const d=Math.hypot(dx,dy);if(d>45){dx*=45/d;dy*=45/d}knob.style.left=35+dx+'px';knob.style.top=35+dy+'px';jx=dx/45;jz=dy/45}
joy.addEventListener('touchstart',e=>{e.preventDefault();jid=e.changedTouches[0].identifier;jm(e.changedTouches[0])},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid)jm(t)},{passive:false});
const jend=e=>{for(const t of e.changedTouches)if(t.identifier===jid){jid=null;jx=jz=0;knob.style.left=knob.style.top='35px'}};joy.addEventListener('touchend',jend);joy.addEventListener('touchcancel',jend);
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space')$('jumpB').onclick();if(e.code==='Enter')$('putB').onclick()});addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
let last=performance.now(),tt=0;const camP=new THREE.Vector3(0,5,15);
function frame(n){requestAnimationFrame(frame);const dt=Math.min(.05,(n-last)/1000);last=n;tt+=dt;
 let mx=jx,mz=jz;if(keys.KeyA||keys.ArrowLeft)mx=-1;if(keys.KeyD||keys.ArrowRight)mx=1;if(keys.KeyW||keys.ArrowUp)mz=-1;if(keys.KeyS||keys.ArrowDown)mz=1;
 const m=Math.min(1,Math.hypot(mx,mz));
 if(m>.1){const sp=6*m;let nx=P.position.x+mx/Math.hypot(mx,mz)*sp*dt*m,nz=P.position.z+mz/Math.hypot(mx,mz)*sp*dt*m;
  face=Math.atan2(mx,mz);
  for(const w of W){if(Math.abs(nx-w.x)<w.w&&Math.abs(nz-w.z)<w.d){if(Math.abs(P.position.x-w.x)<w.w)nz=P.position.z;else nx=P.position.x}}
  const d=Math.hypot(nx,nz);if(d>30.5){nx*=30.5/d;nz*=30.5/d}
  P.position.x=nx;P.position.z=nz;P.rotation.y=face;lg1.rotation.x=Math.sin(tt*12)*.6;lg2.rotation.x=-lg1.rotation.x}else{lg1.rotation.x=lg2.rotation.x=0}
 vy-=22*dt;P.position.y+=vy*dt;if(P.position.y<=0){P.position.y=0;vy=0;onG=true}
 objs.forEach(o=>{if(o.userData.flame)o.userData.flame.scale.setScalar(1+Math.sin(tt*15+o.position.x)*.15);if(o.userData.spin)o.userData.spin.rotation.y+=dt*2;if(o.userData.hop!==undefined)o.position.y=Math.abs(Math.sin(tt*3+o.userData.hop))*.4});
 camP.lerp(new THREE.Vector3(P.position.x,P.position.y+5,P.position.z+8),.08);cam.position.copy(camP);cam.lookAt(P.position.x,P.position.y+1.2,P.position.z);
 R.render(scene,cam)}
requestAnimationFrame(frame);
</script></body></html>
