<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#91dfff"><title>Stjepanov Otok Avanture 🎮</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:#7ad9ff;touch-action:none;user-select:none;-webkit-user-select:none}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:7px;pointer-events:none;color:white;text-shadow:0 2px 5px #2874a8;font-weight:900}#title{background:#1762bbbc;border:2px solid #ffffff8c;padding:8px 12px;border-radius:18px;font-size:clamp(13px,2.5vw,20px)}#count{background:#ffab22;border:2px solid #fff4c6;padding:9px 13px;border-radius:18px;font-size:clamp(14px,3vw,21px);box-shadow:0 4px 0 #bc6a1e}#info{position:absolute;top:68px;left:50%;transform:translateX(-50%);font-size:clamp(12px,2.5vw,18px);font-weight:800;color:#064674;background:#ffffffd6;border-radius:40px;padding:7px 16px;white-space:nowrap;pointer-events:none}#controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}#movement{display:flex;gap:13px}button.control{pointer-events:auto;border:3px solid #fff9;border-radius:22px;width:72px;height:72px;background:#1664cce8;color:white;font-weight:1000;font-size:35px;box-shadow:0 7px 0 #09458e;touch-action:none;outline:none}button.control:active,.control.pressed{transform:translateY(5px);box-shadow:0 2px 0 #09458e}#jump{background:#fe8e1c;box-shadow:0 7px 0 #bc500f;width:91px;font-size:17px;line-height:1.1}#jump:active,#jump.pressed{box-shadow:0 2px 0 #bc500f}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#2e8eda67,#16447db8);padding:18px}#panel{max-width:460px;width:100%;background:#fffffff2;border:5px solid white;border-radius:30px;box-shadow:0 16px 0 #124c8a55,0 25px 60px #0f3e73aa;padding:25px;text-align:center;color:#10548c}#panel h1{font-size:clamp(28px,6vw,42px);line-height:1.05;margin:0 0 12px}#panel p{font-size:17px;line-height:1.35;margin:8px 0 20px}#start{background:#ffab1f;border:0;border-radius:18px;padding:16px 38px;font-size:24px;font-weight:1000;color:#713e06;box-shadow:0 6px 0 #c87812;cursor:pointer}#start:active{transform:translateY(4px)}#footer{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:white;font-size:10px;opacity:.6;pointer-events:none}@media(max-width:480px){#title{font-size:12px;padding:8px}#count{padding:8px}#controls{padding:0 15px}button.control{width:64px;height:64px}#jump{width:77px}#info{top:62px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="title">🏝️ STJEPANOV OTOK AVANTURE</div><div id="count">⭐ <span id="stars">0</span> / 8</div></div><div id="info">Skupi 8 zvjezdica i dođi do zastave! 🏁</div><div id="controls"><div id="movement"><button id="left" class="control" aria-label="Lijevo">◀</button><button id="right" class="control" aria-label="Desno">▶</button></div><button id="jump" class="control" aria-label="Skok">SKOK<br>⬆</button></div><div id="overlay"><div id="panel"><h1 id="heading">🏝️ Stjepanov<br>Otok Avanture</h1><p id="message">Posebna igra za Stjepana! 💙<br>Trči, skači, skupi 8 zvjezdica i osvoji pehar!</p><button id="start">🎮 IGRAJ!</button></div></div><div id="footer">S ljubavlju od djeda ❤️</div><script>
(() => {'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),starsText=document.getElementById('stars'),heading=document.getElementById('heading'),message=document.getElementById('message'),start=document.getElementById('start');let W=0,H=0,dpr=1,cam=0,frame=0,state='menu',score=0,checkpoint=0;const key={left:false,right:false,jump:false};const worldW=3250;const platforms=[{x:0,y:0,w:390},{x:455,y:-60,w:280},{x:790,y:-105,w:230},{x:1085,y:-50,w:295},{x:1450,y:-90,w:250},{x:1770,y:-135,w:255},{x:2100,y:-65,w:310},{x:2480,y:-115,w:300},{x:2860,y:0,w:390}];const starXs=[150,540,870,1190,1525,1870,2230,2615];const items=starXs.map((x,i)=>({x,platform:i,collected:false}));const player={x:65,y:0,vx:0,vy:0,w:34,h:54,grounded:false};let groundBase=0,levelScale=1,baseGround=0;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);levelScale=Math.min(1.2,Math.max(.73,H/650));baseGround=H*.70}addEventListener('resize',resize);resize();function sy(p){return baseGround+p.y*levelScale}function reset(){score=0;checkpoint=0;cam=0;items.forEach(x=>x.collected=false);player.x=65;player.y=sy(platforms[0])-player.h;player.vx=player.vy=0;player.grounded=true;starsText.textContent=score;state='play';overlay.style.display='none';}function showWin(){state='won';heading.innerHTML='🏆 BRAVO, STJEPANE!';message.innerHTML='Osvojio si svih 8 zvjezdica! ⭐<br>Ti si prvak Otoka Avanture! 🎉<br><br>❤️ Od djeda, samo za tebe.';start.textContent='🔁 IGRAJ PONOVNO';overlay.style.display='flex'}start.addEventListener('click',reset);function bind(btn,k){const el=document.getElementById(btn);const down=e=>{e.preventDefault();key[k]=true;el.classList.add('pressed');try{el.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();key[k]=false;el.classList.remove('pressed')};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}bind('left','left');bind('right','right');bind('jump','jump');addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')key.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')key.right=true;if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')key.jump=true});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')key.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')key.right=false;if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')key.jump=false});function respawn(){player.x=Math.max(65,platforms[checkpoint].x+35);player.y=sy(platforms[checkpoint])-player.h-5;player.vx=0;player.vy=0}function update(){if(state!=='play')return;const speed=4.9*levelScale;player.vx=(Number(key.right)-Number(key.left))*speed;if(key.jump&&player.grounded){player.vy=-13.6*levelScale;player.grounded=false}const prevBottom=player.y+player.h;player.vy+=.59*levelScale;player.y+=player.vy;player.x+=player.vx;player.x=Math.max(0,Math.min(worldW-player.w,player.x));player.grounded=false;for(const p of platforms){const top=sy(p);if(player.vy>=0&&prevBottom<=top+11*levelScale&&player.y+player.h>=top&&player.x+player.w>p.x+7&&player.x<p.x+p.w-7){player.y=top-player.h;player.vy=0;player.grounded=true}}if(player.y>H+180)respawn();for(const item of items){if(item.collected)continue;const p=platforms[item.platform],sx=item.x,yy=sy(p)-48*levelScale;if(Math.abs(player.x+player.w/2-sx)<35&&Math.abs(player.y+player.h/2-yy)<48){item.collected=true;score++;starsText.textContent=score}}if(player.grounded){for(let i=0;i<platforms.length;i++){const p=platforms[i];if(player.x>p.x&&player.x<p.x+p.w&&i>checkpoint)checkpoint=i}}if(player.x>worldW-150&&player.grounded&&score===8)showWin();cam+=(Math.max(0,Math.min(worldW-W,player.x-W*.32))-cam)*.13}function cloud(x,y,s){ctx.fillStyle='#ffffffdd';ctx.beginPath();ctx.ellipse(x,y,45*s,20*s,0,0,Math.PI*2);ctx.ellipse(x+29*s,y+1*s,31*s,16*s,0,0,Math.PI*2);ctx.ellipse(x-24*s,y+5*s,27*s,15*s,0,0,Math.PI*2);ctx.ellipse(x+2*s,y-16*s,30*s,26*s,0,0,Math.PI*2);ctx.fill()}function round(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function star(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}function render(){frame++;let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#70c8ff');grad.addColorStop(.66,'#b4ecff');grad.addColorStop(1,'#f7e4b4');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe577';ctx.beginPath();ctx.arc(W*.84,H*.17,45,0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++)cloud(((i*315-cam*.17)%(W+420)+W+420)%(W+420)-120,75+(i%3)*59, .65+(i%3)*.3);ctx.fillStyle='#73cfb2';for(let i=0;i<9;i++){let x=i*450-cam*.25-100;ctx.beginPath();ctx.ellipse(x,H*.76,260,110,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#5ccadd';ctx.fillRect(0,H*.84,W,H*.16);ctx.save();ctx.translate(-cam,0);for(let i=0;i<platforms.length;i++){const p=platforms[i],y=sy(p),hh=H-y+100;round(p.x,y,p.w,hh,7,'#b77645');round(p.x+9,y+12,p.w-18,hh,6,'#d89a5c');round(p.x,y-14*levelScale,p.w,26*levelScale,9,'#46bd60');round(p.x,y-14*levelScale,p.w,10*levelScale,9,'#8deb81');for(let j=0;j<Math.floor(p.w/85);j++){round(p.x+20+j*82,y+56,15,6,4,'#a86942')}if(i===0){round(p.x+38,y-66,11,53,4,'#855c46');round(p.x+18,y-92,51,39,17,'#35ad62');round(p.x+28,y-111,36,41,17,'#42bd69')}if(i===platforms.length-1){round(p.x+p.w-75,y-129,7,114,2,'#c4d5dd');ctx.fillStyle='#ff4e73';ctx.beginPath();ctx.moveTo(p.x+p.w-69,y-127);ctx.lineTo(p.x+p.w-15,y-107);ctx.lineTo(p.x+p.w-69,y-85);ctx.fill();ctx.font='bold 25px system-ui';ctx.fillText('🏆',p.x+p.w-118,y-35)}}for(const item of items){if(item.collected)continue;const p=platforms[item.platform];const bounce=Math.sin(frame*.08+item.platform)*6;const y=sy(p)-50*levelScale+bounce;ctx.shadowColor='#ffdc39';ctx.shadowBlur=19;star(item.x,y,18,'#fff1a5');star(item.x,y,13,'#ffbd20');ctx.shadowBlur=0}if(state!=='menu'){const x=player.x,y=player.y;ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(x+17,y+player.h+4,21,5,0,0,Math.PI*2);ctx.fill();round(x+2,y+23,30,24,5,'#267dd0');round(x-7,y+25,12,25,5,'#f3bd87');round(x+29,y+25,12,25,5,'#f3bd87');round(x+6,y+44,10,10,3,'#213c78');round(x+20,y+44,10,10,3,'#213c78');round(x+1,y,32,29,8,'#ffcc94');round(x+1,y-2,32,10,5,'#73432c');ctx.fillStyle='#263447';ctx.fillRect(x+10,y+13,3,4);ctx.fillRect(x+22,y+13,3,4);ctx.strokeStyle='#96452b';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+17,y+17,5,0,Math.PI);ctx.stroke();ctx.fillStyle='white';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('STJEPAN',x+17,y-13);ctx.textAlign='left'}ctx.restore();if(state==='play'&&player.x>worldW-370&&score<8){ctx.fillStyle='#13578acc';round(W/2-112,105,224,38,18,'#1b77a9df');ctx.fillStyle='white';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('Pronađi još zvjezdica! ⭐',W/2,130);ctx.textAlign='left'}requestAnimationFrame(loop)}function loop(){update();render()}requestAnimationFrame(loop)})();
</script></body></html>
